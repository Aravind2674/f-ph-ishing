<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreatFusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand"><span class="mark" aria-hidden="true"></span>ThreatFusion</header>

  <main>
    <div id="target" class="target">Loading…</div>

    <button id="scan" class="primary" type="button" disabled>Scan</button>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="result" hidden>
      <div id="band" class="band"></div>
      <ul id="reasons" class="reasons"></ul>
      <a id="open" class="open" target="_blank" rel="noopener">Open in ThreatFusion</a>
    </section>

    <label class="check"><input id="full-url" type="checkbox"> Send full URL (path and query)</label>

    <details id="token-box" class="token">
      <summary>API token</summary>
      <div class="token-row">
        <input id="token" type="password" autocomplete="off" placeholder="Paste token" aria-label="API token">
        <button id="token-save" type="button">Save</button>
      </div>
    </details>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
